<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-AI新報 会員版（プロトタイプ）</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2ecdf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Zen+Kurenaido&amp;family=Oswald:wght@500;700&amp;display=swap">
<style>
/* T-AI新報 会員版 ─ 販売LP v4 と同じトークン */
:root {
  --paper: #f2ecdf; --paper2: #e9e1cf; --card: #fbf7ee; --ink: #1b1814; --ink2: #4a443b; --ink3: #6f675b;
  --red: #c1121f; --red2: #a30f1a;
  --g: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --m: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
  --pen: "Zen Kurenaido", cursive;
  --n: "Oswald", "Zen Kaku Gothic New", sans-serif;
  --pad: max(16px, env(safe-area-inset-left, 0px));
  --tabh: 62px;
  --ease: cubic-bezier(.22, .61, .36, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #d9d1bf; color: var(--ink); font-family: var(--g); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
input, select { font: inherit; color: inherit; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
a { color: var(--red); } a:hover { color: var(--red2); }
button { font: inherit; color: inherit; cursor: pointer; }
p, h1, h2, h3 { margin: 0; }
.app { position: relative; max-width: 480px; min-height: 100dvh; margin: 0 auto; background: var(--paper); box-shadow: 0 0 40px rgba(60, 40, 10, .18); padding-bottom: calc(var(--tabh) + 24px + env(safe-area-inset-bottom, 0px)); }
.app.bare { padding-bottom: 24px; }
.app::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .15  0 0 0 .09 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
:is(button, a, select, input, summary):focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

/* 題字（上部） */
.mast { position: sticky; top: 0; z-index: 10; padding: calc(8px + env(safe-area-inset-top, 0px)) var(--pad) 0; background: var(--paper); }
.mast-r { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.mast-t { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mast-t b { font-family: var(--m); font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: .03em; }
.mast-t b i { font-style: normal; color: var(--red); }
.mast-t small { padding: 2px 6px; background: var(--red); color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .08em; }
.mast-chip { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border: 1px solid var(--ink3); color: var(--ink2); white-space: nowrap; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 4px; margin-left: -4px; border: 0; background: none; font-weight: 900; font-size: 15px; }
.back::before { content: "‹"; font-size: 26px; line-height: 1; margin-top: -3px; }
.dbl { height: 6px; margin-top: 6px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
.mast-sub { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--ink); font-size: 11px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.mast-sub span:last-child { overflow: hidden; text-overflow: ellipsis; }

/* タブ */
[hidden] { display: none !important; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px); background: rgba(242, 236, 223, .97); border-top: 2px solid var(--ink); }
.tabs button { position: relative; display: grid; place-content: center; gap: 0; min-height: var(--tabh); border: 0; background: none; text-align: center; line-height: 1.25; transition: background-color .2s; }
.tabs button + button { border-left: 1px solid rgba(27, 24, 20, .18); }
.tabs b { font-weight: 900; font-size: 15px; }
.tabs small { font-size: 10px; font-weight: 700; color: var(--ink3); }
.tabs button.on { background: var(--card); }
.tabs button.on::before { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 4px; background: var(--red); }
.tabs button.on b { color: var(--red); }
.tabs button:active { background: var(--paper2); }

/* 共通 */
.view { position: relative; padding: 0 0 8px; animation: vin .24s var(--ease) both; }
.view.still { animation: none; }
@keyframes vin { from { opacity: 0; transform: translateY(6px); } }
.sec { padding: 22px var(--pad) 0; }
.label { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 13px; letter-spacing: .1em; }
.label b { padding: 2px 9px; background: var(--red); color: #fff; white-space: nowrap; }
.label span { color: var(--ink2); font-weight: 700; white-space: nowrap; }
.label::after { content: ""; flex: 1; height: 1px; background: var(--ink); }
.h1 { margin-top: 12px; font-weight: 900; font-size: clamp(24px, 7.4vw, 32px); line-height: 1.32; text-wrap: balance; }
.h1 em { font-style: normal; color: var(--red); }
.h2 { font-weight: 900; font-size: clamp(20px, 6vw, 25px); line-height: 1.35; text-wrap: balance; }
.lead { margin-top: 8px; font-family: var(--m); font-weight: 700; font-size: 14.5px; line-height: 1.9; color: var(--ink2); }
.note { font-size: 12px; line-height: 1.7; color: var(--ink2); }
.proto { margin: 26px var(--pad) 0; padding-top: 8px; border-top: 1px solid rgba(27, 24, 20, .25); font-size: 11px; color: var(--ink3); text-align: center; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; padding: 0 18px; border: 2px solid var(--ink); text-decoration: none; font-weight: 900; font-size: 16px; letter-spacing: .06em; color: #fff; background: var(--red); box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s; }
.btn:hover { color: #fff; }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
.btn.sub { background: var(--card); color: var(--ink); }
.btn.sub:hover { color: var(--ink); }
.btns { display: grid; gap: 12px; margin-top: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border: 2px solid var(--ink); background: var(--card); }
.seg button { min-height: 44px; border: 0; background: none; font-weight: 900; font-size: 14px; white-space: nowrap; transition: background-color .15s, color .15s; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:disabled { color: var(--ink3); cursor: default; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(27,24,20,.06) 6px 7px); }
.seg button:active:not(:disabled) { background: var(--paper2); }
.seg button[aria-pressed="true"]:active { background: var(--ink); }
.seg.sm button { min-height: 40px; font-size: 13px; }
.box { border: 2px solid var(--ink); background: var(--card); }
.cap { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; background: var(--ink); color: var(--paper); font-weight: 700; font-size: 11.5px; white-space: nowrap; }
.cap span:last-child { overflow: hidden; text-overflow: ellipsis; }
.hn { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 3px; font-family: var(--n); font-weight: 500; font-size: 14px; line-height: 1; box-shadow: inset 0 0 0 1px rgba(27, 24, 20, .35); }
.rb { display: grid; place-items: center; width: 44px; height: 44px; background: var(--ink); color: var(--paper); font-family: var(--n); font-weight: 700; font-size: 18px; line-height: 1; }
.rb small { font-size: 11px; margin-left: 1px; }
.rb.g { background: var(--red); color: #fff; }
.pct { font-family: var(--n); font-weight: 700; font-variant-numeric: tabular-nums; }
.stamp { display: inline-block; padding: 2px 8px; border: 2px solid var(--red); color: var(--red); font-weight: 900; font-size: 12px; line-height: 1.4; transform: rotate(-4deg); white-space: nowrap; }
.pen { position: absolute; overflow: visible; pointer-events: none; }
.pen path { fill: none; stroke: var(--red); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.drawn .pen path { transition: stroke-dashoffset .8s var(--ease); stroke-dashoffset: 0; }
.ring { position: relative; display: inline-block; }
.ring .pen { inset: -9px -11px -8px -9px; width: calc(100% + 20px); height: calc(100% + 17px); }

/* ログイン */
.login { min-height: 100dvh; display: grid; align-content: center; gap: 0; padding: calc(24px + env(safe-area-inset-top, 0px)) var(--pad) 24px; }
.login .big { display: flex; align-items: baseline; gap: 10px; }
.login .big b { font-family: var(--m); font-weight: 800; font-size: clamp(46px, 14vw, 64px); line-height: 1; letter-spacing: .03em; }
.login .big b i { font-style: normal; color: var(--red); }
.login .seal { display: grid; place-items: center; width: 66px; height: 66px; margin-left: auto; border-radius: 50%; border: 3px solid var(--red); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4px var(--red); color: var(--red); font-weight: 900; font-size: 15px; line-height: 1.1; text-align: center; transform: rotate(10deg); }
.field { display: grid; gap: 6px; margin-top: 22px; }
.field label { font-weight: 900; font-size: 13px; }
.field input { width: 100%; min-height: 54px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 0; background: #fffdf7; font-family: var(--n); font-size: 17px; letter-spacing: .02em; }
.field input::placeholder { font-family: var(--g); color: var(--ink3); font-size: 15px; }
.sent { margin-top: 22px; padding: 18px 14px; border: 2px dashed var(--ink); background: var(--card); }
.sent .mail { font-family: var(--n); font-size: 17px; word-break: break-all; }

/* 一面 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 16px; }
.stats div { display: grid; gap: 2px; padding: 8px 6px 9px; text-align: center; }
.stats div + div { border-left: 1px solid var(--ink); }
.stats small { font-size: 10.5px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.stats b { font-family: var(--n); font-weight: 700; font-size: 26px; line-height: 1.05; }
.stats b.jp { font-family: var(--g); font-weight: 900; font-size: 14px; line-height: 1.9; }
.stats .red b { color: var(--red); }
.upd { margin-top: 6px; font-size: 11.5px; color: var(--ink2); text-align: right; }
.feat { margin-top: 14px; }
.fh { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 12px 10px; }
.fh h2 { font-weight: 900; font-size: 19px; line-height: 1.35; }
.fh p { font-size: 12px; color: var(--ink2); line-height: 1.5; }
.mrow { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) 70px; gap: 8px; align-items: center; min-height: 44px; padding: 4px 12px; border-top: 1px solid var(--ink); }
.mrow .mk { text-align: center; font-weight: 900; color: var(--red); }
.mrow .nm { min-width: 0; display: grid; gap: 3px; }
.mrow .nm b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.bar { position: relative; height: 6px; background: var(--paper2); }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width 1s var(--ease); }
.bar.red i, .top .bar i { background: var(--red); }
.mrow .pct { text-align: right; font-size: 18px; }
.mrow.top .pct { color: var(--red); }
.feat .btns { padding: 4px 12px 14px; margin-top: 8px; }
.list { margin-top: 12px; border-top: 3px solid var(--ink); }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 58px; padding: 8px 2px; border: 0; border-bottom: 1px solid var(--ink); background: none; text-align: left; transition: background-color .15s; }
.li:active { background: var(--paper2); }
.li .t { font-size: 11.5px; font-weight: 700; color: var(--ink2); line-height: 1.4; }
.li .h { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 900; font-size: 15px; line-height: 1.4; }
.li .h span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .pct { font-size: 24px; color: var(--red); }
.li .arr { margin-left: 6px; color: var(--ink3); font-weight: 900; }

/* 出馬表の一覧 */
.ctl { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 70px; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--ink); background: none; text-align: left; transition: background-color .15s; }
.rrow:active { background: var(--paper2); }
.rrow .ri { min-width: 0; display: grid; gap: 1px; }
.rrow .ri .tm { font-family: var(--n); font-size: 12px; color: var(--ink2); line-height: 1.3; }
.rrow .ri b { font-weight: 900; font-size: 15px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .ri small { font-size: 11.5px; color: var(--ink2); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .rt { display: grid; justify-items: end; gap: 2px; min-width: 84px; }
.rrow .rt .who { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink2); white-space: nowrap; }
.rrow .rt .pct { font-size: 20px; line-height: 1.1; color: var(--red); }
.rrow .rt .done { font-size: 11px; font-weight: 700; color: var(--ink2); }
.rrow.wait { opacity: .78; }

/* レース詳細 */
.rhead { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px var(--pad) 0; }
.rhead h1 { font-weight: 900; font-size: 21px; line-height: 1.35; }
.rhead p { font-size: 12px; color: var(--ink2); line-height: 1.5; }
.calc { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; margin: 14px var(--pad) 0; padding: 8px 10px; background: var(--ink); color: var(--paper); font-size: 12px; font-weight: 700; }
.calc .rot { position: relative; height: 6px; background: rgba(242, 236, 223, .15); overflow: hidden; }
.calc .rot i { position: absolute; inset: 0 auto 0 0; width: 0; background: repeating-linear-gradient(90deg, var(--paper) 0 6px, transparent 6px 9px); }
.calc.run .rot i { animation: rot 1.25s var(--ease) forwards; }
.calc.ok .rot i { width: 100%; }
@keyframes rot { to { width: 100%; } }
.calc b { font-family: var(--n); font-weight: 500; letter-spacing: .06em; white-space: nowrap; }
.dctl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px var(--pad) 0; }
.dctl .seg { flex: 0 1 220px; }
.dctl small { font-size: 11px; color: var(--ink2); }
.tbl { margin: 10px var(--pad) 0; }
.th { display: grid; grid-template-columns: 6px 30px 22px minmax(0, 1fr) 72px; align-items: center; padding: 4px 0; background: var(--ink); color: var(--paper); font-size: 10.5px; font-weight: 700; }
.th span:nth-child(5) { text-align: right; padding-right: 10px; }
.rows { position: relative; }
.row { position: absolute; left: 0; right: 0; height: 60px; display: grid; grid-template-columns: 6px 30px 22px minmax(0, 1fr) 72px; align-items: center; border-bottom: 1px solid var(--ink); background: var(--card); transition: transform .45s var(--ease); }
.row .gt { align-self: stretch; }
.row .no { align-self: stretch; display: grid; place-items: center; font-family: var(--n); font-weight: 700; font-size: 18px; border-right: 1px solid var(--ink); }
.row .mk { text-align: center; font-weight: 900; font-size: 16px; color: var(--red); }
.row .nm { min-width: 0; padding: 0 6px 0 2px; display: grid; gap: 1px; }
.row .nm b { font-size: 14.5px; font-weight: 900; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm small { font-size: 11px; color: var(--ink2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .nm small em { font-style: normal; font-weight: 700; color: var(--red); }
.row .pc { position: relative; display: grid; gap: 3px; padding-right: 10px; text-align: right; }
.row .pc .pct { font-size: 19px; line-height: 1; }
.row .pc .bar { height: 5px; }
.row .rk { font-size: 9.5px; font-weight: 700; line-height: 1; color: var(--ink3); }
.row.hi .pct { color: var(--red); }
.row.lo { color: var(--ink3); }
.row.lo .nm b { font-weight: 700; }
.row.lo .bar i { background: var(--ink3); }
.row .fin { position: relative; display: inline-block; margin-left: 4px; font-weight: 900; font-size: 11px; color: var(--ink); }
.row.win { background: #fff; }
.instant .bar i { transition: none; }
.dnote { margin: 10px var(--pad) 0; padding: 8px 10px; border-left: 4px solid var(--red); background: var(--card); font-size: 12px; line-height: 1.7; }
.wait-box { margin: 18px var(--pad) 0; padding: 28px 16px; text-align: center; display: grid; justify-items: center; gap: 12px; border: 2px dashed var(--ink); background: var(--card); }
.wait-box .stamp { font-size: 18px; padding: 4px 14px; }
.crow { display: grid; grid-template-columns: 28px minmax(0, 1fr) 64px; gap: 8px; align-items: center; min-height: 46px; padding: 4px 10px; border-top: 1px solid var(--ink); }
.crow:first-of-type { border-top: 0; }
.crow .rk { font-family: var(--n); font-size: 14px; color: var(--ink2); text-align: center; }
.crow .tk { display: flex; align-items: center; gap: 3px; }
.crow .tk i { font-style: normal; color: var(--ink3); font-weight: 700; }
.crow .pr { display: grid; gap: 3px; text-align: right; }
.crow .pr .pct { font-size: 16px; line-height: 1; }
.crow .pr .bar { height: 4px; }
.crow:nth-of-type(-n+3) .pct { color: var(--red); }
.more { display: block; width: 100%; min-height: 46px; border: 0; border-top: 1px solid var(--ink); background: var(--paper2); font-weight: 900; font-size: 13.5px; }

/* 買い目をつくる */
.pick { display: grid; gap: 4px; }
.pick label { font-size: 11.5px; font-weight: 700; color: var(--ink2); }
.pick .lbl { font-size: 11.5px; font-weight: 700; color: var(--ink2); }
.pickbtn { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 12px 8px 8px; border: 2px solid var(--ink); background: var(--card); text-align: left; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
.pickbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.pickbtn .pt { min-width: 0; display: grid; gap: 1px; }
.pickbtn .pt small { font-family: var(--n); font-size: 12px; color: var(--ink2); line-height: 1.3; }
.pickbtn .pt b { font-weight: 900; font-size: 15px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pickbtn .chg { padding: 3px 8px; border: 2px solid var(--red); color: var(--red); font-weight: 900; font-size: 12px; white-space: nowrap; transform: rotate(-3deg); }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(27, 24, 20, .55); opacity: 0; transition: opacity .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 480px; max-height: 86dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--paper); border-top: 3px solid var(--ink); box-shadow: 0 -8px 30px rgba(27, 24, 20, .3); transform: translateY(100%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.open { transform: none; }
.sheet-bg.open { opacity: 1; }
.sheet .sh-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px var(--pad) 0; }
.sheet .sh-h b { font-family: var(--m, inherit); font-weight: 900; font-size: 20px; letter-spacing: .04em; }
.sheet .sh-x { width: 40px; height: 40px; border: 2px solid var(--ink); background: var(--card); font-size: 20px; font-weight: 900; line-height: 1; }
.sheet .sh-x:active { background: var(--paper2); }
.sheet .sh-top { padding: 0 var(--pad) 10px; }
.sheet .sh-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 0 var(--pad) 16px; border-top: 2px solid var(--ink); }
.sheet .rrow.cur { background: var(--card); box-shadow: inset 4px 0 0 var(--red); }
.sheet .rrow .cur-t { font-size: 10.5px; font-weight: 900; color: var(--red); }
body.lock { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg { transition: none; } }

<script>
(() => {

/* ============================================================
   見本データ ─ 本番では同じ形の DATA をデータベースから読み込む

  const CLS = ['2歳未勝利','2歳未勝利','3歳以上1勝クラス','2歳新馬','2歳未勝利','3歳以上1勝クラス','3歳以上1勝クラス','3歳以上2勝クラス', null, null, null, '3歳以上2勝クラス'];

    { name: '京都', code: '08', shift: 0, turf: [1200, 1400, 1600, 1800, 2000, 2200, 2400], dirt: [1200, 1400, 1800, 1900] },
    { name: '東京', code: '05', shift: -10, turf: [1400, 1600, 1800, 2000, 2400], dirt: [1300, 1400, 1600, 2100] },

      let name = CLS[no - 1];
      if (no === 9) name = pick(SP) + '（2勝クラス）';

        const sum = s.reduce((a, b) => a + b, 0);

          while (left.length) { const tot = left.reduce((a, h) => a + h.prob, 0); let u = R() * tot, k = 0; while (k < left.length - 1 && (u -= left[k].prob) > 0) k++; left[k].result = pos++; left.splice(k, 1); }

    updatedAt: '2026-11-21T21:00:00+09:00',
    week: ['2026-11-21', '2026-11-22'],
    today: '2026-11-22',
    member: { name: '会員 太郎', plan: '2027年末まで 長期完全制覇プラン', until: '2027-12-31' },
    notices: [
      { date: '2026-11-21', title: '日曜の出馬表を計算しました', body: '京都・東京の11Rまで、22レースの計算が終わっています。12Rは出馬表が確定したあとに計算します。' },
      { date: '2026-11-19', title: '「成績」面の集計を毎月公開します', body: 'T-AIが出した確率と、実際に勝った割合を、確率帯ごとに毎月この紙面で公開します。数字はごまかしません。' },
      { date: '2026-11-18', title: 'T-AI新報 会員版を公開しました', body: '今週の出馬表、組み合わせの確率、買い目の計算がスマホから使えます。ご意見は公式LINEまでお寄せください。' },
    ],
    races,
  };
}
function gateOf(no, n) { const size = Array(8).fill(1); let extra = Math.max(0, n - 8); for (let k = 7; extra > 0; k = k === 0 ? 7 : k - 1) { size[k]++; extra--; } let acc = 0; for (let k = 0; k < 8; k++) { acc += size[k]; if (no <= acc) return k + 1; } return 8; }

/* ============================================================
   本番データ ─ Supabase。ログインした会員だけが読める（RLS）

   ============================================================ */
const SAMPLE = new URLSearchParams(location.search).has('sample');
const SB_URL = 'https://tpawwkbqwfyohqhvbtui.supabase.co';
const SB_KEY = 'sb_publishable_Ws8k7nsbcxG-9SCbXtzrGQ_lchgKHiZ';  // Publishable key（公開してよい。読める範囲はデータベース側の RLS で制限）
const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } }) : null;
let session = null, memberOk = false, memberStatus = 'none', loadedAt = 0;
let DATA = { updatedAt: new Date().toISOString(), week: [], today: '', member: { name: '', plan: '', until: '2099-12-31' }, notices: [], races: [] };
const jstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const normName = (n) => String(n || '').replace(/\((G[123]|L|OP|Jpn[123])\)/g, '（$1）');
// 読み込みは2段：開いたときは「直近9日（今週と先週末）」だけ、成績の面を開いたら「過去70日」を軽い列で足す
const RACE_COLS = 'race_id,date,venue,race_no,race_name,start_time,surface,distance,field_size,status';
const HORSE_FULL = 'horse_no,gate,horse_name,jockey,weight,last_run,prob,rank,note,result';
const jstDay = (back) => new Date(Date.now() + 9 * 3600e3 - back * 864e5).toISOString().slice(0, 10);
function toRace(r, lite) {
  const ps = (r.predictions || []).slice().sort((a, b) => (a.horse_no ?? 99) - (b.horse_no ?? 99) || a.rank - b.rank);
  const n = ps.length;

    id: r.race_id, date: r.date, venue: r.venue, no: r.race_no, name: normName(r.race_name), start: r.start_time || '',

let histState = 'no', HIST_BINS = [];  // no → loading → ok
async function loadHistory() {

}
async function loadFull(id) {  // 過去のレースを開いたときだけ、騎手・斤量・前走まで取り直す
  const { data } = await sb.from('races').select(`${RACE_COLS}, predictions(${HORSE_FULL})`).eq('race_id', id).maybeSingle();

async function loadData() {

/* ============================================================
   計算 ─ 本番で差し替えるのはこの CALC だけ（Harville法）
   ============================================================ */
const CALC = (() => {
  const cache = new Map();
  const key = (a) => a.slice().sort((x, y) => x - y).join('-');
  function table(race) {
    if (cache.has(race.id)) return cache.get(race.id);
    const p = race.horses.map((h) => h.prob), n = p.length, nos = race.horses.map((h) => h.no);
    const uma = new Map(), wide = new Map(), fuku = new Map(), tri = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const pij = p[i] * p[j] / (1 - p[i]);
      const ku = key([nos[i], nos[j]]); uma.set(ku, (uma.get(ku) || 0) + pij);
      for (let k = 0; k < n; k++) {
        if (k === i || k === j) continue;
        const pr = pij * p[k] / Math.max(1e-9, 1 - p[i] - p[j]);
        tri.push([nos[i], nos[j], nos[k], pr]);
        const kf = key([nos[i], nos[j], nos[k]]); fuku.set(kf, (fuku.get(kf) || 0) + pr);
        [[nos[i], nos[j]], [nos[i], nos[k]], [nos[j], nos[k]]].forEach((pr2) => { const kw = key(pr2); wide.set(kw, (wide.get(kw) || 0) + pr); });
      }
    }
    const t = { p: new Map(race.horses.map((h) => [String(h.no), h.prob])), uma, wide, fuku, tri };
    cache.set(race.id, t); return t;
  }
  const mapOf = (t, kind) => ({ tan: t.p, uma: t.uma, wide: t.wide, fuku: t.fuku })[kind];
  return {
    key,
    /** 組み合わせを確率の高い順に [{nums, prob}] */
    combos(race, kind) { return [...mapOf(table(race), kind)].map(([k, v]) => ({ nums: k.split('-').map(Number), prob: v })).sort((a, b) => b.prob - a.prob); },
    /** 1点の確率 */
    one(race, kind, nums) { return mapOf(table(race), kind).get(key(nums)) || 0; },
    /** 買い目（複数点）のどれかが当たる確率 */
    hit(race, kind, tickets) {
      if (!tickets.length) return 0;
      const t = table(race), set = new Set(tickets.map(key));
      if (kind !== 'wide') return [...set].reduce((a, k) => a + (mapOf(t, kind).get(k) || 0), 0);
      let s = 0;
      for (const [a, b, c, pr] of t.tri) if (set.has(key([a, b])) || set.has(key([a, c])) || set.has(key([b, c]))) s += pr;
      return s;
    },
  };
})();

    ems.forEach((e, i) => { const stop = 380 + (r.horses.length - +e.closest('.row').querySelector('.rk').textContent.replace('位', '')) * 0 + i * 38; if (t < stop) { live = true; e.textContent = (Math.random() * 40).toFixed(1).padStart(4, '0'); } else e.textContent = e.dataset.v; });

/* ─ 買い目をつくる ─ */
const BS = { raceId: null, kind: 'uma', method: 'box', axis: null, sel: new Set(), budget: 3000 };
function comb(arr, k) { const out = []; const rec = (s, acc) => { if (acc.length === k) { out.push(acc.slice()); return; } for (let i = s; i < arr.length; i++) { acc.push(arr[i]); rec(i + 1, acc); acc.pop(); } }; rec(0, []); return out; }
function tickets() {
  const k = BS.kind, sel = [...BS.sel].sort((a, b) => a - b);
  if (k === 'tan') return sel.map((n) => [n]);
  const need = k === 'fuku' ? 3 : 2;
  if (BS.method === 'box') return comb(sel, need);
  if (BS.axis == null) return [];
  return comb(sel.filter((n) => n !== BS.axis), need - 1).map((c) => [BS.axis, ...c].sort((a, b) => a - b));
}

/* ─ 成績 ─ */
let resState = { m: '' };
const BINS = [[0, .05, '5%未満'], [.05, .10, '5〜10%'], [.10, .20, '10〜20%'], [.20, .30, '20〜30%'], [.30, 1.01, '30%以上']];
const winOf = (r) => (r.lite ? r.w : winner(r));
const topWon = (r) => (r.lite ? r.topWin : !!top(r) && top(r).result === 1);
function vResults() {
  const months = [...new Set(DATA.races.filter((r) => r.status === 'done').map((r) => r.date.slice(0, 7)))].sort();
  const done = DATA.races.filter((r) => r.status === 'done' && r.date.startsWith(resState.m));
  const hs = done.filter((r) => !r.lite).flatMap((r) => r.horses);
  const hb = HIST_BINS.filter((b) => b.m === resState.m);
  const bins = BINS.map(([a, b, l], i) => {
    const g = hs.filter((h) => h.prob >= a && h.prob < b), x = hb.filter((y) => y.i === i);
    const n = g.length + x.reduce((s, y) => s + y.n, 0);
    const sp = g.reduce((s, h) => s + h.prob, 0) + x.reduce((s, y) => s + y.s, 0);
    const w = g.filter((h) => h.result === 1).length + x.reduce((s, y) => s + y.w, 0);
    return { l, n, pred: sp / (n || 1), act: w / (n || 1) };
  });
  const nh = bins.reduce((s, b) => s + b.n, 0);
  const t1 = done.filter(topWon).length;
  if (!done.length) return `<section class="sec"><div class="label"><b>成績</b><span>答え合わせ</span></div>${histState === 'loading' ? '<p class="note" style="margin-top:8px">過去の成績を読み込んでいます…</p>' : ''}<div class="wait-box"><span class="stamp">集計待ち</span><p class="h2">レースが終わると、<br>ここに答え合わせが載ります。</p><p class="note">各レースの結果は、発走のおよそ15〜20分後に、自動で載ります。</p></div></section>`;
  const days = [...new Set(done.map((r) => r.date))].sort().reverse();
  return `<section class="sec">
    <div class="label"><b>成績</b><span>答え合わせ</span></div>
    ${histState === 'loading' ? '<p class="note" style="margin-top:8px">過去の成績を読み込んでいます…</p>' : ''}
    <h1 class="h1">言った確率は、<br><em>現実になったか。</em></h1>
    <div class="seg" role="group" aria-label="月" style="margin-top:14px">${months.map((m) => `<button type="button" data-month="${m}" aria-pressed="${m === resState.m}">${+m.slice(5)}月</button>`).join('')}</div>
    <div class="box cal" style="margin-top:12px">
      <div class="cap"><span>確率帯ごとの集計</span><span>${done.length}R・${nh.toLocaleString('ja-JP')}頭</span></div>
      <div class="r h"><span>確率帯</span><span>頭数</span><span>予測の平均</span><span>実際の勝率</span></div>
      ${bins.map((b) => `<div class="r"><span>${b.l}</span><span class="cnt">${b.n}</span><span class="pct">${b.n ? pct(b.pred) + '%' : '—'}</span><span class="pct act">${b.n ? pct(b.act) + '%' : '—'}</span></div>`).join('')}
    </div>
    <p class="note" style="margin-top:8px">「予測の平均」と「実際の勝率」が近いほど、T-AIの確率が正しかったことになります。</p>
    <div class="big1"><span><small>T-AIの1番手が勝ったレース</small></span><b>${t1}<small> / ${done.length}</small></b></div>
  </section>
  <section class="sec">
    <div class="label"><b>日ごとの結果</b><span>1着の馬と、T-AIの確率</span></div>
    <div style="margin-top:8px;border-top:3px solid var(--ink)">
      ${days.map((d, di) => { const rs = done.filter((r) => r.date === d); const hit = rs.filter(topWon).length;
        return `<details class="day"${di === 0 ? ' open' : ''}><summary><span>${fd(d)}<small>${rs.length}R・1番手の勝ち ${hit}</small></span></summary>
          ${rs.filter(winOf).map((r) => { const w = winOf(r); return `<button type="button" class="drow${w.rank === 1 ? ' hit' : ''}" data-go="#/race/${r.id}"><span class="v">${r.no}R<small>${r.venue}</small></span><span class="w"><span class="ring" data-pen>${hn(w)}${w.rank === 1 ? ring('drawn') : ''}</span><b>${esc(w.name)}</b></span><span class="s"><span class="pct">${pct(w.prob)}%</span>T-AI ${w.rank}番手</span></button>`; }).join('')}
        </details>`; }).join('')}
    </div>
  </section>`;
}

    <div class="label"><b>会員</b><span>マイページ</span></div>
    <div class="card"><span class="sl">T-AI</span><p class="ttl">会員証</p>
      <dl><dt>ご登録</dt><dd style="word-break:break-all">${esc((session && session.user && session.user.email) || m.name)}</dd><dt>プラン</dt><dd>${esc(m.plan)}</dd><dt>利用期限</dt><dd>${m.admin ? '期限なし（管理者）' : `${y}年${mm}月${d}日まで<br><span class="pct">残り ${days}日</span>`}</dd></dl>
    </div>
  </section>
  <section class="sec">
    <div class="label"><b>紙面の読み方</b><span>はじめての方へ</span></div>
    <div class="guide">
      <details><summary>「勝つ確率」とは</summary><p>T-AIが計算した、その馬が1着になる確率です。1つのレースの全馬を足すと100%になります。</p></details>
      <details><summary>◎○▲△ の印</summary><p>勝つ確率の高い順に、1番手から4番手の馬に付けています。</p></details>
      <details><summary>組み合わせの確率</summary><p>出馬表の面の下に、馬連・ワイド・3連複が当たる確率を、高い順に載せています。</p></details>
      <details><summary>買い目をつくる</summary><p>券種と買い方を選び、馬番をタップすると、その買い目のどれかが当たる確率と点数が、すぐに出ます。予算を入れると、1点あたりの金額も出ます。</p></details>
      <details><summary>いつ更新されるか</summary><p>JRAの枠順が確定する前日の午前10時30分ごろのあと、自動で計算して載せます。当日の朝に出走取消・競走除外があれば、計算し直します。レースの結果は、発走のおよそ15〜20分後に、出馬表と「成績」の面に載ります。</p></details>
    </div>
  </section>
  <section class="sec news">
    <div class="label"><b>お知らせ</b><span>運営より</span></div>
    <div style="margin-top:8px;border-top:3px solid var(--ink)">
      ${DATA.notices.length ? '' : '<p class="note" style="padding:12px 0">お知らせはありません。</p>'}${DATA.notices.map((n, i) => `<details${i === 0 ? ' open' : ''}><summary><span><small>${n.date.replace(/-/g, '.')}</small>${esc(n.title)}</span></summary><p>${esc(n.body)}</p></details>`).join('')}
    </div>
    <div class="btns">
      <a class="btn" href="https://lin.ee/uDgbNni" target="_blank" rel="noopener">公式LINEで問い合わせる<span>▶</span></a>
      <button class="btn sub" type="button" id="logout">ログアウト</button>
    </div>
  </section>`;
}

/* ============================================================
   画面の切り替え（#/home  #/races  #/race/ID  #/build/ID  #/results  #/my  #/login  #/sent）
   ============================================================ */
let lastMail = (() => { try { return sessionStorage.getItem('taiapp:mail') || ''; } catch (e) { return ''; } })(), curTab = 'home';
const logged = () => SAMPLE || !!session;
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  clearTimers(); closeSheet(true);
  const [, name = 'home', arg] = (location.hash || '#/home').split('/');
  if (!logged() && name !== 'login' && name !== 'sent') return go('#/login');
  if (logged() && (name === 'login' || name === 'sent')) return go('#/home');
  const app = $('#app'), view = $('#view'), mastEl = $('#mast'), tabs = $('#tabs');
  const bare = name === 'login' || name === 'sent';
  app.classList.toggle('bare', bare); mastEl.hidden = bare; tabs.hidden = bare;
  let html = '', tab = name, mopts = {};
  const empty = !bare && memberOk && !DATA.races.length;
  if (logged() && !memberOk && !bare) { tab = ''; html = vNoMember(); }
  else if (name === 'login') html = vLogin();
  else if (empty && name !== 'my') { html = vEmpty(); }
  else if (name === 'sent') html = vSent(lastMail);
  else if (name === 'races') html = vRaces();
  else if (name === 'race') { const r = byId.get(arg) || weekRaces(DATA.today)[0]; tab = DATA.week.includes(r.date) ? 'races' : 'results'; mopts = { back: tab, backLabel: tab === 'races' ? '出馬表' : '成績', sub: `${fd(r.date)} ${r.venue}${r.no}R` }; raceState.limit = 20; view.dataset.race = r.id; if (DATA.week.includes(r.date)) { listState.d = r.date; listState.v = r.venue; } if (r.lite) { html = '<section class="sec"><p class="note" style="padding:40px 0;text-align:center">紙面を組んでいます…</p></section>'; loadFull(r.id); } else html = vRace(r); }
  else if (name === 'build') { const r = byId.get(arg); const bl = buildable(); if (r && bl.includes(r) && r.id !== BS.raceId) { BS.raceId = r.id; BS.axis = null; BS.sel.clear(); } if (!BS.raceId || !byId.has(BS.raceId)) BS.raceId = (bl.find((x) => /G1/.test(x.name)) || bl[0] || {}).id; html = BS.raceId ? vBuild() : (DATA.races.length ? vBuildWait() : vEmpty()); }
  else if (name === 'results') { html = vResults(); if (histState === 'no') loadHistory(); }
  else if (name === 'my') html = vMy();
  else { tab = 'home'; html = vHome(); mopts = { sub: fd(homeDayOf()) + ' 開催' }; }
  curTab = tab;
  if (!bare) mastEl.innerHTML = memberOk ? mast(mopts) : '';
  view.className = 'view'; void view.offsetWidth;
  view.innerHTML = html + (bare ? '' : proto);
  document.querySelectorAll('.tabs button').forEach((b) => { b.classList.toggle('on', b.dataset.tab === tab); b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'); });
  scrollTo(0, 0);
  if (empty || !memberOk) return;
  if (name === 'race' && !byId.get(view.dataset.race).lite) mountRace(byId.get(view.dataset.race));
  if (name === 'build' && BS.raceId) { shownHit = 0; updateBuild(); }
  if (name === 'sent') { const c = $('#code'); if (c) setTimeout(() => c.focus(), 50); }
  if (name === 'login') { const m = $('#mail'); if (m && lastMail) m.value = lastMail; }
  if (name === 'home' || !['login', 'sent', 'race', 'build', 'races', 'results', 'my'].includes(name)) {
    const feat = view.querySelector('.feat');
    if (feat) later(() => feat.querySelectorAll('.bar i').forEach((i) => { i.style.width = i.dataset.w + '%'; }), 120);
    drawSoon(view, 700);
  }
  if (name === 'results') drawSoon(view, 200);
}
function rerender() { const y = scrollY; const v = $('#view'); route(); v.classList.add('still'); scrollTo(0, y); }

document.addEventListener('click', (e) => {
  if (e.target.id === 'sheetBg') { closeSheet(); return; }
  const t = e.target.closest('button, a'); if (!t) return;
  const ds = t.dataset;
  if (t.id === 'raceOpen') { openSheet(); return; }
  if (t.id === 'resend') {
    const msg = $('#resendMsg');
    if (!lastMail) { go('#/login'); return; }
    t.disabled = true; msg.hidden = false; msg.textContent = '送っています…';
    sb.auth.signInWithOtp({ email: lastMail, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } }).then(({ error }) => {
      msg.textContent = error ? (/rate|seconds|security/i.test(String(error.message)) ? '少し時間をおいてから、もう一度お試しください。' : '送れませんでした。時間をおいてもう一度お試しください。') : '新しい番号を送りました。いちばん新しいメールの番号を入れてください。';
      setTimeout(() => { const b = $('#resend'); if (b) b.disabled = false; }, 60e3);
    }).catch(() => { msg.textContent = '通信に失敗しました。'; t.disabled = false; });
    return;
  }
  if (t.id === 'sheetX') { closeSheet(); return; }
  if (ds.sday) { sheetState.d = ds.sday; sheetState.v = ''; sheetRedraw(); return; }
  if (ds.sven) { sheetState.v = ds.sven; sheetRedraw(); return; }
  if (ds.pickrace) { if (ds.pickrace !== BS.raceId) { BS.raceId = ds.pickrace; BS.axis = null; BS.sel.clear(); } closeSheet(true); rerender(); return; }
  if (ds.go) { go(ds.go); return; }
  if (ds.tab) { const map = { home: '#/home', races: '#/races', build: '#/build', results: '#/results', my: '#/my' }; go(map[ds.tab]); return; }
  if (ds.back) { let nav = false; try { nav = !!sessionStorage.getItem('taiapp:nav'); } catch (e) {} if (history.length > 1 && nav) history.back(); else go('#/' + ds.back); return; }
  if (ds.day) { listState.d = ds.day; const vs = [...new Set(weekRaces(ds.day).map((r) => r.venue))]; if (!vs.includes(listState.v)) listState.v = vs[0] || ''; rerender(); return; }
  if (ds.hday) { homeDay = ds.hday; listState.d = ds.hday; const vs = [...new Set(weekRaces(ds.hday).map((r) => r.venue))]; if (!vs.includes(listState.v)) listState.v = vs[0] || ''; rerender(); return; }
  if (ds.ven) { listState.v = ds.ven; rerender(); return; }
  if (ds.sort) { raceState.sort = ds.sort; placeRows(byId.get($('#view').dataset.race)); return; }
  if (ds.kind) { raceState.kind = ds.kind; raceState.limit = 20; document.querySelectorAll('#kindSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === ds.kind))); renderCombos(byId.get($('#view').dataset.race)); return; }
  if (t.id === 'more') { raceState.limit += 20; renderCombos(byId.get($('#view').dataset.race)); return; }
  if (ds.bk) { BS.kind = ds.bk; if (ds.bk === 'tan') { BS.method = 'box'; } BS.axis = null; if (BS.kind !== 'tan' && BS.method === 'nagashi') BS.sel.clear(); rerender(); return; }
  if (ds.bm) { if (t.disabled) return; BS.method = ds.bm; if (ds.bm === 'nagashi') { const s = [...BS.sel]; BS.axis = null; BS.sel = new Set(s); } rerender(); return; }
  if (ds.h) {
    const n = +ds.h, nag = BS.method === 'nagashi' && BS.kind !== 'tan';
    if (!nag) { BS.sel.has(n) ? BS.sel.delete(n) : BS.sel.add(n); }
    else if (BS.axis === n) BS.axis = null;
    else if (BS.sel.has(n)) BS.sel.delete(n);
    else if (BS.axis == null) BS.axis = n;
    else BS.sel.add(n);
    if (navigator.vibrate) navigator.vibrate(6);
    updateBuild(); return;
  }
  if (t.id === 'clear') { BS.axis = null; BS.sel.clear(); updateBuild(); return; }
  if (ds.month) { resState.m = ds.month; rerender(); return; }
  if (t.id === 'logout') { if (SAMPLE) { location.href = location.pathname; return; } dropCache(); sb.auth.signOut().finally(() => { session = null; memberOk = false; memberStatus = 'none'; go('#/login'); }); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet')) closeSheet(); });
document.addEventListener('input', (e) => {
  if (e.target.id === 'bud') updateBuild();
  // 6桁そろったら、そのまま開く
  if (e.target.id === 'code' && e.target.value.replace(/\D/g, '').length === 6) { const f = $('#codeForm'); if (f && !$('#codeBtn').disabled) f.requestSubmit(); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id === 'codeForm') {
    e.preventDefault();
    const code = $('#code').value.replace(/\D/g, ''), err = $('#codeErr');
    if (code.length < 6 || code.length > 8) { err.textContent = 'メールに書かれた6桁の番号を入れてください。'; err.hidden = false; return; }
    if (!lastMail) { err.textContent = 'もう一度、メールアドレスから入れ直してください。'; err.hidden = false; return; }
    const cb = $('#codeBtn'); cb.disabled = true;
    sb.auth.verifyOtp({ email: lastMail, token: code, type: 'email' }).then(({ data, error }) => {
      cb.disabled = false;
      if (error) { err.textContent = /expired|invalid/i.test(String(error.message)) ? '番号が違うか、期限が切れています。番号を確かめるか、もう一度メールを送ってください。' : '開けませんでした。時間をおいてもう一度お試しください。'; err.hidden = false; return; }
      session = data.session; boot();
    }).catch(() => { cb.disabled = false; err.textContent = '通信に失敗しました。電波の良いところでもう一度お試しください。'; err.hidden = false; });
    return;
  }
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  const mail = $('#mail').value.trim(), err = $('#loginErr'), btn = $('#loginBtn');
  if (SAMPLE) { go('#/home'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) { err.textContent = 'メールアドレスを入れてください。'; err.hidden = false; return; }
  btn.disabled = true;
  sb.auth.signInWithOtp({ email: mail, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } }).then(({ error }) => {
    btn.disabled = false;
    if (error) {
      const m = String(error.message || '');
      err.textContent = /signup|not allowed|not found/i.test(m) ? 'このメールアドレスは会員として登録されていません。' : /rate|seconds|security/i.test(m) ? '短い時間に何度も送ったため、少し待ってからもう一度お試しください。' : 'メールを送れませんでした。時間をおいてもう一度お試しください。';
      err.hidden = false; return;
    }
    lastMail = mail; try { sessionStorage.setItem('taiapp:mail', mail); } catch (e) {} go('#/sent');
  }).catch(() => { btn.disabled = false; err.textContent = '通信に失敗しました。電波の良いところでもう一度お試しください。'; err.hidden = false; });
});
addEventListener('hashchange', () => { try { sessionStorage.setItem('taiapp:nav', '1'); } catch (e) {} route(); });
// 開いたままの画面も、戻ってきたとき（前の読み込みから10分たっていれば）新しい予想に入れ替える
async function refresh(force) {
  if (SAMPLE || !session || !memberOk) return;
  if (!force && (document.hidden || Date.now() - loadedAt < 5 * 60e3)) return;  // 開催中は結果が5分ごとに入るので、5分たったら入れ替える
  if (location.hash.startsWith('#/build') && BS.sel.size) { loadedAt = 0; return; }  // 買い目を選んでいる途中は入れ替えない（次の機会に）
  const keep = { d: listState.d, v: listState.v, m: resState.m, b: BS.raceId, sel: [...BS.sel], ax: BS.axis, hist: histState === 'ok' };
  try { await loadData(); } catch (e) { loadedAt = Date.now() - 9 * 60e3; return; }  // 失敗したら1分後にもう一度
  afterLoad();
  if (DATA.week.includes(keep.d)) { listState.d = keep.d; listState.v = keep.v; }
  if (keep.m) resState.m = keep.m;
  if (byId.has(keep.b)) { BS.raceId = keep.b; }
  rerender();
  if (keep.hist) loadHistory();
}
document.addEventListener('visibilitychange', refresh);
setInterval(refresh, 60e3);
async function boot() {
  if (SAMPLE || !sb) { useSample(); afterLoad(); route(); return; }
  if (!session) { const { data } = await sb.auth.getSession(); session = data.session; }
  // メールのリンクから戻ったとき、URL に残ったログイン情報を消す
  if (/access_token|error_description/.test(location.hash)) history.replaceState(null, '', location.pathname + '#/home');
  if (session) {
    const cached = readCache();
    if (cached) {  // 前回の紙面をすぐ出し、裏で新しいものを取る
      DATA = cached; memberOk = true; memberStatus = 'ok'; loadedAt = 0; afterLoad(); route();
      refresh(true); return;
    }
    $('#view').innerHTML = '<section class="sec"><p class="note" style="padding:40px 0;text-align:center">紙面を組んでいます…</p></section>';
    try { await loadData(); } catch (e) { memberOk = false; memberStatus = 'error'; }
    afterLoad();
  }
  route();
}
if (sb) sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' && !session) { session = s; boot(); } if (ev === 'SIGNED_OUT') session = null; });
boot();
})();
</script>
