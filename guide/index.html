<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1814">
<title>T-AI 使い方マニュアル</title>
<meta name="description" content="T-AI会員サイトでできることを、スワイプで1つずつ紹介します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&amp;family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Oswald:wght@500;700&amp;display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
:root {
  --red: #c1121f; --red2: #8f0c16; --red3: #e3202e;
  --ink: #1b1814; --ink2: #4a443b; --paper: #f2ecdf; --paper2: #e9e1cf; --card: #fffdf7; --star: #ffd76a;
  --gold: #e2b857; --gold2: #f5dc92;
  --foil: linear-gradient(100deg, #b8862e, #f5dc92 22%, #fff6d8 32%, #e2b857 46%, #a8761f 62%, #f5dc92 80%, #c9973a);
  --g: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --m: "Shippori Mincho B1", serif; --n: "Oswald", sans-serif;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(.22, .61, .36, 1); --pop: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0e0c0a; color: var(--ink); font-family: var(--g); -webkit-tap-highlight-color: transparent; overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: var(--red); } a:hover { color: var(--red2); }
:is(a, button, summary):focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
.app { position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--paper); overflow: hidden; }
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px #2b2620, 0 30px 80px rgba(0, 0, 0, .6); } }

/* 上：進み具合と目次 */
.bar { position: absolute; z-index: 5; inset: 0 0 auto 0; padding: calc(var(--top) + 8px) 12px 10px; background: linear-gradient(rgba(14, 12, 10, .78), rgba(14, 12, 10, 0)); pointer-events: none; }
.prog { display: flex; gap: 4px; pointer-events: auto; }
.prog button { flex: 1; height: 14px; padding: 5px 0; border: 0; background: none; cursor: pointer; }
.prog button i { display: block; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .3); overflow: hidden; }
.prog button i::after { content: ""; display: block; height: 100%; width: 0; background: #fff; transition: width .45s var(--ease); }
.prog button.done i::after { width: 100%; }
.prog button.on i::after { width: 100%; background: var(--foil); box-shadow: 0 0 6px rgba(255, 215, 106, .8); }
.bar-r { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; pointer-events: auto; }
.logo { display: flex; align-items: baseline; gap: 6px; font-family: var(--m); font-weight: 800; font-size: 17px; color: #fff; letter-spacing: .02em; white-space: nowrap; }
.logo i { font-style: normal; color: var(--red3); }
.logo small { font-family: var(--g); font-weight: 700; font-size: 11px; color: #e9e1cf; }
.logo .ct { margin-left: 4px; font-family: var(--n); font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--gold2); }
.tocbtn { min-height: 36px; padding: 0 14px; border: 1.5px solid rgba(255, 255, 255, .7); border-radius: 999px; background: rgba(0, 0, 0, .35); color: #fff; font: 900 13px var(--g); cursor: pointer; backdrop-filter: blur(4px); }

/* スライド */
.track { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.sl { --p: 0; position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: flex; flex-direction: column; }

/* 表紙 */
.cover { background: radial-gradient(circle at 50% 36%, #ef2c3a 0, #c1121f 36%, #5e070d 100%); color: #fff; padding: calc(var(--top) + 64px) 22px calc(var(--bot) + 20px); isolation: isolate; }
.cover::before { content: ""; position: absolute; z-index: -2; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .1) 0 5deg, transparent 5deg 12deg); animation: spin 80s linear infinite; }
.cover::after { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(circle, rgba(0, 0, 0, .22) 1.1px, transparent 1.5px) 0 0 / 7px 7px; -webkit-mask: linear-gradient(170deg, transparent 30%, #000 85%); mask: linear-gradient(170deg, transparent 30%, #000 85%); }
@keyframes spin { to { transform: rotate(1turn); } }
.glow { position: absolute; z-index: -1; left: 50%; top: 30%; width: 120%; aspect-ratio: 1; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(255, 226, 150, .45), transparent 55%); animation: breathe 4s ease-in-out infinite; pointer-events: none; }
@keyframes breathe { 50% { opacity: .55; transform: translate(-50%, -50%) scale(1.08); } }
.cv-k { align-self: flex-start; padding: 4px 12px; background: var(--ink); color: var(--gold2); font-weight: 900; font-size: 12px; letter-spacing: .1em; white-space: nowrap; transform: skewX(-8deg); }
.cv-k span { display: inline-block; transform: skewX(8deg); }
.foil { background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 4s ease-in-out infinite alternate; }
@keyframes foil { to { background-position: 100% 0; } }
.cv-t { position: relative; margin: 12px 0 0; font-family: var(--m); font-weight: 800; font-size: clamp(70px, 24vw, 108px); line-height: .95; filter: drop-shadow(0 4px 0 rgba(60, 0, 0, .55)); }
.cv-t i { font-style: normal; }
.cv-t .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .95) 50%, transparent 60%) no-repeat; background-size: 40% 100%; background-position: -60% 0; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3.6s ease-in-out 1.4s infinite; }
@keyframes shine { 0% { background-position: -60% 0; } 40%, 100% { background-position: 170% 0; } }
.cv-s { margin: 6px 0 0; font-weight: 900; font-size: clamp(28px, 9vw, 38px); line-height: 1.22; text-shadow: 3px 3px 0 var(--ink); }
.cv-l { margin: 10px 0 0; font-weight: 700; font-size: 15px; line-height: 1.7; color: #ffe9e9; }
.phones { position: relative; flex: 1; min-height: 0; margin-top: 12px; }
.phones .ph { position: absolute; bottom: 0; height: 84%; width: auto; }
.phones .ph:nth-child(1) { left: 4%; transform: rotate(-9deg); transform-origin: 50% 100%; }
.phones .ph:nth-child(2) { left: 50%; z-index: 2; height: 96%; bottom: 10px; transform: translateX(-50%); box-shadow: 0 0 0 3px var(--gold2), 0 22px 44px rgba(40, 0, 0, .6); }
.phones .ph:nth-child(3) { right: 4%; transform: rotate(9deg); transform-origin: 50% 100%; }
.ph { border: 5px solid #111; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 14px 30px rgba(0, 0, 0, .45); aspect-ratio: 390 / 760; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: opacity .18s; }
.star { position: absolute; z-index: 3; right: 2px; top: -8px; width: 94px; height: 94px; display: grid; place-items: center; text-align: center; color: var(--ink); font-weight: 900; font-size: 13px; line-height: 1.25; background: var(--star); clip-path: polygon(50% 0, 61% 17%, 80% 7%, 79% 28%, 98% 31%, 86% 48%, 100% 63%, 80% 69%, 82% 90%, 62% 84%, 50% 100%, 38% 84%, 18% 90%, 20% 69%, 0 63%, 14% 48%, 2% 31%, 21% 28%, 20% 7%, 39% 17%); transform: rotate(10deg); }
.ribbon { position: absolute; z-index: 4; left: -12%; right: -12%; bottom: calc(var(--bot) + 128px); padding: 7px 0; background: var(--ink); border-block: 2px solid transparent; border-image: var(--foil) 1; transform: rotate(-5deg); overflow: hidden; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); pointer-events: none; }
.ribbon div { display: flex; width: max-content; gap: 0; animation: tick 38s linear infinite; }
.ribbon span { padding: 0 14px; font-weight: 900; font-size: 13.5px; color: var(--gold2); white-space: nowrap; }
.ribbon span::after { content: "★"; margin-left: 28px; color: var(--red3); }
@keyframes tick { to { transform: translateX(-50%); } }
.hint { position: absolute; z-index: 6; right: 16px; bottom: calc(var(--bot) + 74px); display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 16px; border-radius: 999px; background: #fff; color: var(--red); font-weight: 900; font-size: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-8px); } }
/* 表紙の登場（読み込み時に1回） */
html.js .cover .cv-k { animation: inUp .5s var(--ease) .1s both; }
html.js .cover .cv-t { animation: stamp .7s var(--pop) .25s both; }
html.js .cover .cv-s { animation: inUp .5s var(--ease) .5s both; }
html.js .cover .cv-l { animation: inUp .5s var(--ease) .62s both; }
html.js .phones .ph:nth-child(1) { animation: fanL .8s var(--ease) .75s both; }
html.js .phones .ph:nth-child(2) { animation: rise .8s var(--ease) .6s both; }
html.js .phones .ph:nth-child(3) { animation: fanR .8s var(--ease) .75s both; }
html.js .star { animation: starIn .6s var(--pop) 1.25s both; }
html.js .ribbon { animation: ribIn .7s var(--ease) 1.05s both; }
@keyframes inUp { from { opacity: 0; transform: translateY(16px); } }
@keyframes stamp { from { opacity: 0; transform: scale(1.6); filter: blur(6px); } }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 40px); } }
@keyframes fanL { from { opacity: 0; transform: translateX(45%) rotate(0); } }
@keyframes fanR { from { opacity: 0; transform: translateX(-45%) rotate(0); } }
@keyframes starIn { from { opacity: 0; transform: rotate(-90deg) scale(.2); } }
@keyframes ribIn { from { opacity: 0; transform: rotate(-5deg) translateX(30%); } }

/* 使い方 */
.use { background: var(--paper); padding: calc(var(--top) + 62px) 0 0; }
.use::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgba(27, 24, 20, .07) 1px, transparent 1.4px) 0 0 / 8px 8px; pointer-events: none; }
.use-h { position: relative; overflow: hidden; padding: 12px 18px 14px; background: var(--red); color: #fff; isolation: isolate; }
.use-h::before { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(circle, rgba(0, 0, 0, .2) 1.1px, transparent 1.5px) 0 0 / 7px 7px; -webkit-mask: linear-gradient(100deg, transparent 35%, #000); mask: linear-gradient(100deg, transparent 35%, #000); }
.use-h .no { position: absolute; z-index: -1; right: 10px; top: 50%; font-family: var(--n); font-weight: 700; font-size: 104px; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(255, 230, 170, .5); translate: calc(var(--p) * -90px) -50%; }
.use-h .wm { position: absolute; z-index: -1; right: 96px; top: 50%; width: 76px; height: 76px; fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; translate: calc(var(--p) * -40px) -50%; rotate: calc(var(--p) * 25deg); }
.use-h .lbl { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 6px; background: var(--ink); color: var(--star); font-weight: 900; font-size: 12px; letter-spacing: .1em; }
.use-h .lbl svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.use-h h2 { position: relative; max-width: 15em; margin: 6px 0 0; font-weight: 900; font-size: clamp(20px, 6.2vw, 26px); line-height: 1.34; text-shadow: 2px 2px 0 var(--red2); text-wrap: balance; }
.who { position: relative; display: flex; gap: 8px; align-items: baseline; margin: 0; padding: 9px 18px; background: var(--ink); color: #f2ecdf; font-weight: 700; font-size: 14px; line-height: 1.55; }
.who b { flex: none; padding: 0 7px; background: var(--star); color: var(--ink); font-size: 12px; line-height: 1.7; }
.steps { position: relative; margin: 0; padding: 12px 18px 2px; list-style: none; counter-reset: s; }
.steps li { position: relative; padding: 0 0 8px 36px; font-weight: 700; font-size: 16.5px; line-height: 1.6; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff; font-family: var(--n); font-size: 15px; line-height: 1; box-shadow: 0 2px 0 var(--red2); }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 28px; bottom: 2px; border-left: 2px dotted rgba(193, 18, 31, .45); }
.steps b { font-weight: 900; }
.steps mark { color: inherit; font-weight: 900; background: linear-gradient(rgba(255, 215, 106, .95), rgba(255, 215, 106, .95)) no-repeat 0 88% / 100% 42%; padding: 0 1px; }
.fig { position: relative; flex: 1; min-height: 0; margin: 4px 18px 0; cursor: pointer; }
.fig .ph { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: calc(100% + 30px); width: auto; max-width: 92%; border-bottom: 0; border-radius: 22px 22px 0 0; translate: calc(var(--p) * 70px) 0; rotate: calc(var(--p) * 5deg); box-shadow: 0 0 0 1px rgba(27, 24, 20, .1), 0 16px 34px rgba(27, 24, 20, .28); }
.fig .cap { position: absolute; z-index: 2; left: 50%; bottom: calc(var(--bot) + 66px); transform: translateX(-50%); white-space: nowrap; padding: 5px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 12px; box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.fig .dots { position: absolute; z-index: 2; left: 50%; bottom: calc(var(--bot) + 98px); transform: translateX(-50%); display: flex; gap: 6px; padding: 5px 8px; border-radius: 99px; background: rgba(255, 253, 247, .9); }
.fig .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 24, 20, .3); transition: width .25s var(--ease), background-color .25s; }
.fig .dots i.on { width: 20px; border-radius: 4px; background: var(--red); }
.fig .tapnote { position: absolute; z-index: 2; right: 4%; top: 12px; padding: 4px 10px; border-radius: 999px; background: var(--star); font-weight: 900; font-size: 11px; box-shadow: 0 3px 0 rgba(27, 24, 20, .25); }
.fig .tapnote::before { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid var(--star); animation: ping 1.8s ease-out infinite; }
@keyframes ping { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(1.25); } }
.fig.sw img { opacity: 0; }

/* 画面に入ったときの動き */
html.js .sl:not(.on) .use-h h2, html.js .sl:not(.on) .use-h .lbl { opacity: 0; translate: 24px 0; }
html.js .sl:not(.on) .steps li { opacity: 0; translate: 22px 0; }
html.js .sl:not(.on) .steps mark { background-size: 0% 42%; }
html.js .sl:not(.on) .fig .cap, html.js .sl:not(.on) .fig .tapnote { opacity: 0; translate: 0 8px; }
.sl.on .use-h .lbl { transition: opacity .35s var(--ease), translate .35s var(--ease); }
.sl.on .use-h h2 { transition: opacity .4s var(--ease) .06s, translate .4s var(--ease) .06s; }
.sl.on .steps li { transition: opacity .4s var(--ease), translate .4s var(--ease); }
.sl.on .steps li:nth-child(1) { transition-delay: .14s; } .sl.on .steps li:nth-child(2) { transition-delay: .22s; } .sl.on .steps li:nth-child(3) { transition-delay: .30s; } .sl.on .steps li:nth-child(4) { transition-delay: .38s; }
.sl.on .steps mark { transition: background-size .55s var(--ease) .55s; }
.sl.on .fig .cap, .sl.on .fig .tapnote { transition: opacity .35s var(--ease) .4s, translate .35s var(--ease) .4s; }

/* v2 */
.use.v2 { background: radial-gradient(120% 70% at 50% 100%, #3a2a10, #14110d 60%); color: #f2ecdf; }
.use.v2::before { background: repeating-conic-gradient(from 0deg at 50% 70%, rgba(226, 184, 87, .07) 0 4deg, transparent 4deg 12deg); animation: spin 120s linear infinite; inset: -50%; }
.use.v2 .use-h { background: linear-gradient(120deg, #000, #1b1814 55%, #2a1f0c); border-bottom: 3px solid transparent; border-image: var(--foil) 1; }
.use.v2 .use-h::before { background: radial-gradient(circle, rgba(245, 220, 146, .16) 1.1px, transparent 1.5px) 0 0 / 7px 7px; }
.use.v2 .use-h .no { display: none; }
.use.v2 .use-h .wm { stroke: rgba(245, 220, 146, .18); right: 112px; }
.use.v2 .v2mark { position: absolute; z-index: -1; right: 12px; top: 50%; display: grid; justify-items: end; translate: calc(var(--p) * -90px) -50%; }
.use.v2 .v2mark b { font-family: var(--n); font-weight: 700; font-size: 74px; line-height: .9; filter: drop-shadow(0 0 14px rgba(226, 184, 87, .45)); }
.use.v2 .v2mark small { font-family: var(--n); font-weight: 500; font-size: 10px; letter-spacing: .3em; color: var(--gold2); }
.use.v2 .use-h .lbl { background: var(--foil); color: var(--ink); }
.use.v2 .use-h h2 { text-shadow: 0 2px 0 #000; }
.use.v2 .who { background: #2a241c; border-bottom: 1px solid rgba(226, 184, 87, .3); }
.use.v2 .who b { background: var(--foil); }
.use.v2 .steps li::before { background: var(--foil); color: var(--ink); box-shadow: 0 0 10px rgba(226, 184, 87, .5); }
.use.v2 .steps li:not(:last-child)::after { border-color: rgba(226, 184, 87, .5); }
.use.v2 .steps mark { color: var(--ink); background-image: linear-gradient(#f5dc92, #f5dc92); background-position: 0 100%; background-size: 100% 100%; }
html.js .use.v2:not(.on) .steps mark { background-size: 0% 100%; }
.use.v2 .fig .ph { border-color: #0b0a08; box-shadow: 0 0 0 2px #e2b857, 0 0 40px rgba(226, 184, 87, .35); }
.use.v2 .fig .ring { position: absolute; z-index: 0; top: -6px; left: 50%; width: calc(var(--w, 60%) + 12px); height: calc(100% + 40px); transform: translateX(-50%); border-radius: 28px 28px 0 0; overflow: hidden; translate: calc(var(--p) * 70px) 0; rotate: calc(var(--p) * 5deg); pointer-events: none; }
.use.v2 .fig .ring::before { content: ""; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent 0 60%, #fff6d8 70%, #e2b857 76%, transparent 86%); animation: spin 3.2s linear infinite; }
.use.v2 .fig .cap { background: var(--foil); color: var(--ink); font-weight: 900; }
.use.v2 .fig .dots { background: rgba(20, 17, 13, .85); }
.use.v2 .fig .dots i { background: rgba(245, 220, 146, .35); }
.use.v2 .fig .dots i.on { background: var(--gold); }
.use.v2 .flash { position: absolute; z-index: 8; inset: 0; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(255, 246, 216, .55) 48%, rgba(226, 184, 87, .25) 52%, transparent 65%) no-repeat; background-size: 250% 100%; background-position: 150% 0; }
.use.v2.on .flash { animation: flash 1.1s var(--ease) .15s 1 both; }
@keyframes flash { to { background-position: -150% 0; } }

/* 下の固定ボタン */
.open { position: absolute; z-index: 6; left: 18px; right: 18px; bottom: calc(var(--bot) + 12px); display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 999px; background: var(--red); color: #fff; text-decoration: none; font-weight: 900; font-size: 15.5px; letter-spacing: .04em; box-shadow: 0 0 0 2px var(--gold2) inset, 0 5px 0 var(--red2), 0 10px 24px rgba(0, 0, 0, .25); transition: background .3s, color .3s, box-shadow .3s, transform .12s; overflow: hidden; }
.open:hover { color: #fff; }
.open:active { transform: translateY(3px); }
.open::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .45) 50%, transparent 65%) no-repeat; background-size: 250% 100%; background-position: 160% 0; animation: btnShine 4.5s ease-in-out 2s infinite; }
@keyframes btnShine { 0% { background-position: 160% 0; } 30%, 100% { background-position: -60% 0; } }
.open.gold { background: var(--foil); color: var(--ink); box-shadow: 0 0 0 2px #fff6d8 inset, 0 5px 0 #6e4c12, 0 0 30px rgba(226, 184, 87, .45); }
.open.gold:hover { color: var(--ink); }

/* 基本の3操作 */
.basic { background: var(--paper); padding: calc(var(--top) + 68px) 18px calc(var(--bot) + 76px); }
.sec-k { font-family: var(--n); font-weight: 700; font-size: 13px; letter-spacing: .28em; color: var(--red); }
.sec-t { margin: 2px 0 12px; font-weight: 900; font-size: clamp(24px, 7.4vw, 30px); line-height: 1.3; }
.sec-t em { font-style: normal; color: #fff; background: var(--red); padding: 0 6px; margin: 0 2px; }
.b3 { position: relative; display: grid; gap: 10px; flex: 1; min-height: 0; grid-template-rows: repeat(3, minmax(0, 1fr)); }
.b3::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 10px; border-left: 3px dashed rgba(193, 18, 31, .35); }
.b3 > div { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; min-height: 0; padding: 8px 12px 8px 8px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 var(--ink); }
.b3 .ph { border-width: 3px; border-radius: 12px; height: 100%; width: auto; max-height: 100%; box-shadow: none; }
.b3 b { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; line-height: 1.3; }
.b3 b span { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #fff; font-family: var(--n); font-size: 16px; box-shadow: 0 2px 0 var(--red2); }

/* よくある質問 */
.end { background: var(--ink); color: #f2ecdf; padding: calc(var(--top) + 68px) 18px calc(var(--bot) + 84px); overflow-y: auto; }

.end .sec-k { color: var(--gold2); }
.end .sec-t { color: #fff; }
.end details { margin-top: 8px; border-radius: 12px; background: #2a241c; border: 1px solid transparent; transition: border-color .2s; }
.end details[open] { border-color: rgba(226, 184, 87, .5); }
.end summary { display: grid; grid-template-columns: 26px minmax(0, 1fr) 16px; gap: 10px; align-items: center; min-height: 52px; padding: 10px 14px; font-weight: 900; font-size: 15px; line-height: 1.5; cursor: pointer; list-style: none; }
.end summary::-webkit-details-marker { display: none; }
.end summary::before { content: "Q"; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; background: var(--red); color: #fff; font-family: var(--n); font-size: 14px; }
.end summary::after { content: "＋"; color: var(--star); }
.end details[open] summary::after { content: "－"; }
.end details p { margin: 0; padding: 0 16px 14px 50px; font-size: 14.5px; line-height: 1.8; color: #e9e1cf; }
.end details p b { color: var(--gold2); }
.end .note { margin: 16px 0 0; font-size: 12.5px; line-height: 1.7; color: #b9ae9a; }
.end .again { display: block; width: 100%; margin-top: 14px; min-height: 46px; border: 1.5px solid #6f675b; border-radius: 999px; background: none; color: #f2ecdf; font: 900 14px var(--g); cursor: pointer; }

.tap { position: absolute; z-index: 1; top: 0; bottom: 0; width: 22%; }
.tap.l { left: 0; } .tap.r { right: 0; }

.toc { position: absolute; z-index: 10; inset: 0; background: rgba(14, 12, 10, .97); color: #fff; padding: calc(var(--top) + 18px) 16px calc(var(--bot) + 20px); overflow-y: auto; transform: translateY(100%); transition: transform .38s var(--ease); visibility: hidden; }
.toc.on { transform: none; visibility: visible; }
.toc::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--foil); }
.toc-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toc-h b { font-weight: 900; font-size: 20px; }
.toc-h button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #2a241c; color: #fff; font-size: 20px; cursor: pointer; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: grid; gap: 8px; align-content: start; min-height: 116px; padding: 12px; border: 1.5px solid rgba(245, 220, 146, .25); border-radius: 14px; background: linear-gradient(160deg, #2a241d, #1b1814 70%); color: #fff; text-align: left; font: inherit; cursor: pointer; overflow: hidden; }
.tile.cur { border-color: var(--gold2); box-shadow: 0 0 0 1px var(--gold2); }

.tile b { font-weight: 900; font-size: 14.5px; line-height: 1.45; }

html.js .toc:not(.on) .tile { opacity: 0; translate: 0 14px; }
.toc.on .tile { transition: opacity .35s var(--ease) calc(.12s + var(--i) * 30ms), translate .35s var(--ease) calc(.12s + var(--i) * 30ms); }

/* 小さい画面（375×667 など） */

@media (prefers-reduced-motion: reduce) {

const FAQ = [
  ['ログインのコードが届きません', 'まず迷惑メールフォルダを確認してください。au・ドコモ・ソフトバンクのアドレスの方は、<b>no-reply@clubkawasaki.net</b> を受信許可（ドメイン指定受信）に追加してください。コードを何度か頼んだときは、いちばん新しいメールのコードを、届いてから30分以内に入力してください。'],
  ['ホーム画面に追加するには？', 'iPhoneは、Safariで会員サイトを開き、下の共有ボタン（□に↑）から「ホーム画面に追加」。Androidは、Chromeの右上のメニュー（︙）から「ホーム画面に追加」または「アプリをインストール」。会員サイトのマイページにも手順があります。'],

];
const pad = (n) => String(n).padStart(2, '0');
const ic = (k, cls = '') => `<svg viewBox="0 0 24 24" aria-hidden="true"${cls ? ` class="${cls}"` : ''}>${ICONS[k]}</svg>`;
const img = (f, alt, eager) => `<img src="${SHOTS}${f}" alt="${alt}"${eager ? '' : ' loading="lazy"'} decoding="async">`;

const slides = [];
const ribbon = USES.map((u) => `<span>${u.title}</span>`).join('');
slides.push({ name: '表紙', html: `<section class="sl cover" aria-label="表紙">
  <span class="glow" aria-hidden="true"></span>
  <span class="cv-k"><span>T-AI 会員サイト 公式ガイド</span></span>

slides.push({ name: '基本操作', html: `<section class="sl basic" aria-label="基本の3操作">

    <div><div class="ph">${img('basic-1-login.png', 'ログイン')}</div><div><b><span>1</span>ログイン</b><p>メールに届く6桁のコードを入れるだけ（30分有効）。</p></div></div>

USES.forEach((u, i) => slides.push({ name: u.title, use: u, html: `<section class="sl use${u.v2 ? ' v2' : ''}" aria-label="使い方${pad(i + 1)} ${u.title}">

</section>` }));
slides.push({ name: 'よくある質問', html: `<section class="sl end" aria-label="よくある質問">

const track = document.getElementById('track');
track.innerHTML = slides.map((s) => s.html).join('');
const els = [...track.children];
els.forEach((el, i) => { if (!el.classList.contains('end')) el.insertAdjacentHTML('beforeend', `<span class="tap l" data-go="${i - 1}"></span><span class="tap r" data-go="${i + 1}"></span>`); });

const bars = [...document.querySelectorAll('#prog button')];
document.getElementById('tiles').innerHTML = slides.map((s, i) => s.use

const fitRing = () => document.querySelectorAll('.use.v2 .fig').forEach((f) => { const ph = f.querySelector('.ph'); f.style.setProperty('--w', ph.offsetWidth + 'px'); });

  raf = 0;

}
track.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(frame); }, { passive: true });

  const g = e.target.closest('[data-go]');
  if (g) { tocShow(false); go(+g.dataset.go); return; }
  const f = e.target.closest('.fig');
  if (f) {
    const figs = JSON.parse(f.dataset.figs); if (figs.length < 2) return;
    const k = ((+f.dataset.k || 0) + 1) % figs.length; f.dataset.k = k;
    const im = f.querySelector('img');
    f.classList.add('sw');
    setTimeout(() => {
      im.src = SHOTS + figs[k].f; im.alt = figs[k].c;
      f.querySelector('.cap').textContent = figs[k].c;
      f.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === k));
      const done = () => f.classList.remove('sw');
      im.complete ? done() : (im.onload = done, im.onerror = done);
    }, RM ? 0 : 160);
  }
});
document.getElementById('tocOpen').onclick = () => tocShow(true);
document.getElementById('tocClose').onclick = () => tocShow(false);
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'Escape') tocShow(false); });
addEventListener('resize', () => { go(cur, false); fitRing(); });
addEventListener('load', fitRing);

/* 表紙から始まったときだけ、次の画面を少しのぞかせて「横にめくれる」ことを伝える */
let touched = false;
track.addEventListener('pointerdown', () => { touched = true; }, { once: true, passive: true });
const peek = () => {
  if (RM || touched || cur !== 0) return;
  track.style.scrollSnapType = 'none';
  track.scrollTo({ left: Math.round(track.clientWidth * .16), behavior: 'smooth' });
  setTimeout(() => { track.scrollTo({ left: 0, behavior: 'smooth' }); setTimeout(() => { track.style.scrollSnapType = ''; }, 500); }, 520);
};

// URLの #ev などから、その使い方を開く
const h = location.hash.slice(1); const start = slides.findIndex((s) => (s.use && s.use.id === h) || (h === 'basic' && s.name === '基本操作') || (h === 'faq' && s.name === 'よくある質問'));
requestAnimationFrame(() => { if (start > 0) go(start, false); frame(); fitRing(); if (start <= 0) setTimeout(peek, 2300); });
})();
</script>
