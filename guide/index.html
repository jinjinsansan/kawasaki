<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1814">
<title>T-AI 使い方マニュアル</title>
<meta name="description" content="T-AI会員サイトでできることを、スワイプで1つずつ紹介します。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #c1121f; --red2: #8f0c16; --red3: #e3202e;
  --ink: #1b1814; --ink2: #4a443b; --paper: #f2ecdf; --paper2: #e9e1cf; --card: #fffdf7; --star: #ffd76a;
  --foil: linear-gradient(100deg, #b8862e, #f5dc92 22%, #fff6d8 32%, #e2b857 46%, #a8761f 62%, #f5dc92 80%, #c9973a);
  --g: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --m: "Shippori Mincho B1", serif; --n: "Oswald", sans-serif;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0e0c0a; color: var(--ink); font-family: var(--g); -webkit-tap-highlight-color: transparent; overflow: hidden; }
.app { position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--paper); overflow: hidden; }
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px #2b2620, 0 30px 80px rgba(0, 0, 0, .6); } }

/* 上：進み具合（ストーリー風）と目次 */
.bar { position: absolute; z-index: 5; inset: 0 0 auto 0; padding: calc(var(--top) + 8px) 12px 8px; background: linear-gradient(rgba(14, 12, 10, .72), rgba(14, 12, 10, 0)); pointer-events: none; }
.prog { display: flex; gap: 4px; pointer-events: auto; }
.prog button { flex: 1; height: 14px; padding: 5px 0; border: 0; background: none; cursor: pointer; }
.prog button i { display: block; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .35); overflow: hidden; }
.prog button i::after { content: ""; display: block; height: 100%; width: 0; background: #fff; }
.prog button.done i::after { width: 100%; }
.prog button.on i::after { width: 100%; background: var(--star); }
.bar-r { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; pointer-events: auto; }
.logo { font-family: var(--m); font-weight: 800; font-size: 17px; color: #fff; letter-spacing: .02em; }
.logo i { font-style: normal; color: var(--red3); }
.logo small { margin-left: 6px; font-family: var(--g); font-weight: 700; font-size: 11px; color: #e9e1cf; }
.tocbtn { min-height: 34px; padding: 0 14px; border: 1.5px solid rgba(255, 255, 255, .7); border-radius: 999px; background: rgba(0, 0, 0, .35); color: #fff; font: 900 13px var(--g); cursor: pointer; }

/* スライド：横にスワイプ */
.track { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.track::-webkit-scrollbar { display: none; }
.sl { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; display: flex; flex-direction: column; }

/* 表紙 */
.cover { background: radial-gradient(circle at 50% 38%, #e3202e 0, #c1121f 38%, #6d0910 100%); color: #fff; padding: calc(var(--top) + 64px) 22px calc(var(--bot) + 20px); }
.cover::before { content: ""; position: absolute; inset: -40%; background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .09) 0 6deg, transparent 6deg 14deg); animation: spin 90s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.cover > * { position: relative; }
.cv-k { align-self: flex-start; padding: 4px 12px; border-radius: 999px; background: var(--ink); font-weight: 900; font-size: 12px; letter-spacing: .1em; }
.foil { background: var(--foil); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: foil 5s ease-in-out infinite alternate; }
@keyframes foil { to { background-position: 100% 0; } }
.cv-t { margin: 14px 0 0; font-family: var(--m); font-weight: 800; font-size: clamp(72px, 24vw, 108px); line-height: .95; filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .35)); }
.cv-t i { font-style: normal; color: var(--star); -webkit-text-fill-color: var(--star); }
.cv-s { margin: 8px 0 0; font-weight: 900; font-size: clamp(28px, 9vw, 38px); line-height: 1.25; text-shadow: 0 3px 0 rgba(0, 0, 0, .3); }
.cv-l { margin: 12px 0 0; font-weight: 700; font-size: 15px; line-height: 1.7; color: #ffe9e9; }
.phones { position: relative; flex: 1; min-height: 0; margin-top: 14px; }
.phones .ph { position: absolute; bottom: 0; height: 86%; width: auto; }
.phones .ph:nth-child(1) { left: 6%; transform: rotate(-8deg); }
.phones .ph:nth-child(2) { left: 50%; z-index: 2; height: 96%; bottom: 10px; transform: translateX(-50%); }
.phones .ph:nth-child(3) { right: 6%; transform: rotate(8deg); }
.ph { border: 5px solid #111; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 14px 30px rgba(0, 0, 0, .45); aspect-ratio: 390 / 760; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.star { position: absolute; z-index: 3; right: 6px; top: -10px; width: 92px; height: 92px; display: grid; place-items: center; text-align: center; color: var(--ink); font-weight: 900; font-size: 13px; line-height: 1.25; background: var(--star); clip-path: polygon(50% 0, 61% 17%, 80% 7%, 79% 28%, 98% 31%, 86% 48%, 100% 63%, 80% 69%, 82% 90%, 62% 84%, 50% 100%, 38% 84%, 18% 90%, 20% 69%, 0 63%, 14% 48%, 2% 31%, 21% 28%, 20% 7%, 39% 17%); transform: rotate(10deg); }
.hint { position: absolute; z-index: 4; right: 16px; bottom: calc(var(--bot) + 18px); display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: #fff; color: var(--red); font-weight: 900; font-size: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-8px); } }

/* 使い方のスライド */
.use { background: var(--paper); padding: calc(var(--top) + 64px) 0 0; }
.use-h { position: relative; padding: 14px 18px 14px 18px; background: var(--red); color: #fff; }
.use-h .no { position: absolute; right: 12px; top: -6px; font-family: var(--n); font-weight: 700; font-size: 88px; line-height: 1; color: rgba(255, 255, 255, .18); }
.use-h .lbl { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 12px; letter-spacing: .1em; color: var(--star); }
.use-h .lbl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.use-h h2 { position: relative; margin: 4px 0 0; font-weight: 900; font-size: clamp(21px, 6.4vw, 26px); line-height: 1.35; }
.who { margin: 0; padding: 10px 18px; background: var(--ink); color: #f2ecdf; font-weight: 700; font-size: 14px; line-height: 1.6; }
.who b { color: var(--star); margin-right: 6px; }
.steps { margin: 0; padding: 12px 18px 4px; list-style: none; counter-reset: s; }
.steps li { position: relative; padding: 0 0 8px 34px; font-weight: 700; font-size: 16.5px; line-height: 1.6; counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--red); color: #fff; font-family: var(--n); font-size: 14px; }
.steps b { font-weight: 900; }
.steps mark { background: linear-gradient(transparent 62%, rgba(193, 18, 31, .28) 62%); color: inherit; }
.fig { position: relative; flex: 1; min-height: 0; margin: 4px 18px 0; }
.fig .ph { position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: calc(100% + 30px); width: auto; max-width: 92%; border-bottom: 0; border-radius: 22px 22px 0 0; }
.fig .cap { position: absolute; z-index: 2; left: 50%; bottom: calc(var(--bot) + 64px); transform: translateX(-50%); white-space: nowrap; padding: 5px 12px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 700; font-size: 12px; }
.fig .dots { position: absolute; z-index: 2; left: 50%; bottom: calc(var(--bot) + 96px); transform: translateX(-50%); display: flex; gap: 6px; }
.fig .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(27, 24, 20, .3); }
.fig .dots i.on { background: var(--red); }
.fig .tapnote { position: absolute; z-index: 2; right: 10%; top: 10px; padding: 4px 10px; border-radius: 999px; background: var(--star); font-weight: 900; font-size: 11px; }
.open { position: absolute; z-index: 6; left: 18px; right: 18px; bottom: calc(var(--bot) + 12px); display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 999px; background: var(--red); color: #fff; text-decoration: none; font-weight: 900; font-size: 15px; box-shadow: 0 0 0 2px #f5dc92 inset, 0 6px 0 var(--red2); }

/* v2 だけ黒と金 */
.use.v2 { background: #14110d; color: #f2ecdf; }
.use.v2 .use-h { background: linear-gradient(135deg, #1b1814, #000); border-bottom: 3px solid #e2b857; }
.use.v2 .use-h .lbl { color: #f5dc92; }
.use.v2 .v2mark { display: block; font-family: var(--n); font-weight: 700; font-size: 44px; line-height: 1; }
.use.v2 .who { background: #2a241c; }
.use.v2 .steps li::before { background: var(--foil); color: #1b1814; }
.use.v2 .steps mark { background: linear-gradient(transparent 62%, rgba(226, 184, 87, .45) 62%); }
.use.v2 .fig .cap { background: #e2b857; color: #1b1814; }
.open.gold { background: var(--foil); color: #1b1814; box-shadow: 0 0 0 2px #fff6d8 inset, 0 6px 0 #6e4c12; }

/* 基本操作・最後 */
.basic { background: var(--paper); padding: calc(var(--top) + 70px) 18px calc(var(--bot) + 16px); }
.sec-k { font-family: var(--n); font-weight: 700; font-size: 13px; letter-spacing: .2em; color: var(--red); }
.sec-t { margin: 2px 0 12px; font-weight: 900; font-size: clamp(24px, 7.4vw, 30px); line-height: 1.3; }
.sec-t em { font-style: normal; color: var(--red); }
.b3 { display: grid; gap: 10px; flex: 1; min-height: 0; grid-template-rows: repeat(3, minmax(0, 1fr)); }
.b3 > div { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; min-height: 0; padding: 8px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 2px var(--ink); }
.b3 .ph { border-width: 3px; border-radius: 12px; height: 100%; width: auto; max-height: 100%; }
.b3 b { display: block; font-weight: 900; font-size: 18px; }
.b3 b span { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: 6px; border-radius: 50%; background: var(--red); color: #fff; font-family: var(--n); font-size: 15px; vertical-align: 2px; }
.b3 p { margin: 4px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink2); }
.end { background: var(--ink); color: #f2ecdf; padding: calc(var(--top) + 70px) 18px calc(var(--bot) + 16px); overflow-y: auto; }
.end .sec-t { color: #fff; }
.end details { margin-top: 8px; border-radius: 12px; background: #2a241c; }
.end summary { padding: 14px 16px; font-weight: 900; font-size: 15px; cursor: pointer; list-style: none; }
.end summary::after { content: "＋"; float: right; color: var(--star); }
.end details[open] summary::after { content: "－"; }
.end details p { margin: 0; padding: 0 16px 14px; font-size: 14.5px; line-height: 1.75; color: #e9e1cf; }
.end { padding-bottom: calc(var(--bot) + 84px) !important; }
.cover .hint { bottom: calc(var(--bot) + 76px); }
.end .note { margin: 16px 0 0; font-size: 12.5px; line-height: 1.7; color: #b9ae9a; }
.end .again { display: block; width: 100%; margin-top: 12px; min-height: 44px; border: 1.5px solid #6f675b; border-radius: 999px; background: none; color: #f2ecdf; font: 900 14px var(--g); cursor: pointer; }

/* 左右のタップ（写真の上でも次へ進める） */
.tap { position: absolute; z-index: 1; top: 0; bottom: 0; width: 22%; }
.tap.l { left: 0; } .tap.r { right: 0; }

/* 目次 */
.toc { position: absolute; z-index: 10; inset: 0; background: rgba(14, 12, 10, .96); color: #fff; padding: calc(var(--top) + 20px) 16px 20px; overflow-y: auto; transform: translateY(100%); transition: transform .28s ease; }
.toc.on { transform: none; }
.toc-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toc-h b { font-weight: 900; font-size: 20px; }
.toc-h button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #2a241c; color: #fff; font-size: 20px; cursor: pointer; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { position: relative; display: grid; gap: 8px; align-content: start; min-height: 116px; padding: 12px; border: 0; border-radius: 14px; background: #241f19; color: #fff; text-align: left; font: inherit; cursor: pointer; overflow: hidden; }
.tile .num { font-family: var(--n); font-weight: 700; font-size: 26px; line-height: 1; }
.tile b { font-weight: 900; font-size: 14.5px; line-height: 1.45; }
.tile svg { position: absolute; right: 12px; top: 12px; width: 26px; height: 26px; fill: none; stroke: var(--star); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile.v2 { grid-column: span 2; background: linear-gradient(135deg, #c1121f, #6d0910); }
.tile.sm { min-height: 0; background: #2a241c; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>

];
const pad = (n) => String(n).padStart(2, '0');
const ic = (k) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
const img = (f, alt) => `<img src="${SHOTS}${f}" alt="${alt}" loading="lazy" decoding="async">`;

const slides = [];
slides.push({ name: '表紙', html: `<section class="sl cover" aria-label="表紙">
  <span class="cv-k">T-AI 会員サイト 公式ガイド</span>
  <h1 class="cv-t"><span class="foil">T<i>-</i>AI</span></h1>
  <p class="cv-s">使い方<br>マニュアル</p>
  <p class="cv-l">できることを、1画面に1つずつ。<br>スワイプで見ていけます。</p>
  <div class="phones"><div class="ph">${img('hero-1.png', 'レース一覧')}</div><div class="ph">${img('hero-2.png', '出馬表')}</div><div class="ph">${img('hero-3.png', 'v2タブ')}</div><span class="star">スマホで<br>ぜんぶ<br>できる</span></div>
  <span class="hint">スワイプ →</span></section>` });
slides.push({ name: '基本操作', html: `<section class="sl basic" aria-label="基本の3操作">
  <span class="sec-k">BASIC</span><h2 class="sec-t">まずは<em>3つ</em>の基本操作</h2>
  <div class="b3">
    <div><div class="ph">${img('basic-1-login.png', 'ログイン')}</div><div><b><span>1</span>ログイン</b><p>メールに届く6桁のコードを入れるだけ。</p></div></div>
    <div><div class="ph">${img('basic-2-races.png', '今日のレース')}</div><div><b><span>2</span>レースを選ぶ</b><p>「今日のレース」から見たいレースを選ぶ。</p></div></div>
    <div><div class="ph">${img('basic-3-card.png', '出馬表')}</div><div><b><span>3</span>出馬表を見る</b><p>全馬の勝つ確率と期待値が並ぶ。</p></div></div>
  </div></section>` });
USES.forEach((u, i) => slides.push({ name: u.title, use: u, html: `<section class="sl use${u.v2 ? ' v2' : ''}" aria-label="使い方${pad(i + 1)} ${u.title}">
  <div class="use-h"><span class="no">${pad(i + 1)}</span>${u.v2 ? '<span class="v2mark foil">v2</span>' : ''}
    <span class="lbl">${ic(u.icon)}使い方 ${pad(i + 1)}</span><h2>${u.title}</h2></div>
  <p class="who"><b>こんな人に</b>${u.who}</p>
  <ol class="steps">${u.steps.map((s) => `<li>${s}</li>`).join('')}</ol>
  <div class="fig" data-figs='${JSON.stringify(u.figs).replace(/'/g, '&#39;')}'>
    <div class="ph">${img(u.figs[0].f, u.figs[0].c)}</div>
    ${u.figs.length > 1 ? `<span class="tapnote">写真をタップで切り替え</span><div class="dots">${u.figs.map((_, k) => `<i class="${k ? '' : 'on'}"></i>`).join('')}</div>` : ''}
    <span class="cap">${u.figs[0].c}</span>
  </div>
</section>` }));
slides.push({ name: 'よくある質問', html: `<section class="sl end" aria-label="よくある質問">
  <span class="sec-k">FAQ</span><h2 class="sec-t">よくある質問</h2>
  ${FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('')}
  <button type="button" class="again" data-go="0">最初から見る</button>
  <p class="note">※T-AIの確率や買い目は、過去のデータをもとにした予測で、将来の払い戻しや利益を約束するものではありません。※馬券は会員さまご自身で、JRAの即PATから購入します。</p></section>` });

const track = document.getElementById('track');
track.innerHTML = slides.map((s) => s.html).join('');
const els = [...track.children];
els.forEach((el, i) => { if (!el.classList.contains('end')) el.insertAdjacentHTML('beforeend', `<span class="tap l" data-go="${i - 1}"></span><span class="tap r" data-go="${i + 1}"></span>`); });
document.getElementById('prog').innerHTML = slides.map((s, i) => `<button type="button" data-go="${i}" aria-label="${s.name}"><i></i></button>`).join('');
const bars = [...document.querySelectorAll('#prog button')];
document.getElementById('tiles').innerHTML = slides.map((s, i) => s.use
  ? `<button type="button" class="tile${s.use.v2 ? ' v2' : ''}" data-go="${i}"><span class="num">${s.use.v2 ? 'v2' : pad(i - 1)}</span>${ic(s.use.icon)}<b>${s.use.title}</b></button>`
  : `<button type="button" class="tile sm" data-go="${i}"><b>${s.name}</b></button>`).join('');

let cur = 0;
const go = (i, smooth = true) => { i = Math.max(0, Math.min(els.length - 1, i)); track.scrollTo({ left: i * track.clientWidth, behavior: smooth ? 'smooth' : 'auto' }); };
const mark = () => {
  cur = Math.round(track.scrollLeft / track.clientWidth);
  bars.forEach((b, i) => { b.classList.toggle('done', i < cur); b.classList.toggle('on', i === cur); });
  const u = slides[cur] && slides[cur].use, op = document.getElementById('openApp');
  op.href = APP + (u ? u.open : '/'); op.textContent = u && u.open !== '/' ? 'この画面を開く ▶' : '会員サイトを開く ▶'; op.classList.toggle('gold', !!(u && u.v2));
  try { history.replaceState(null, '', '#' + (slides[cur].use ? slides[cur].use.id : cur === 0 ? '' : cur === 1 ? 'basic' : 'faq')); } catch (e) { /* 何もしない */ }
};
let t;
track.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(mark, 60); }, { passive: true });
const toc = document.getElementById('toc');
const tocShow = (on) => { toc.classList.toggle('on', on); toc.setAttribute('aria-hidden', String(!on)); };
document.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { tocShow(false); go(+g.dataset.go); return; }
  const f = e.target.closest('.fig');
  if (f) {
    const figs = JSON.parse(f.dataset.figs); if (figs.length < 2) return;
    const k = ((+f.dataset.k || 0) + 1) % figs.length; f.dataset.k = k;
    f.querySelector('img').src = SHOTS + figs[k].f; f.querySelector('img').alt = figs[k].c;
    f.querySelector('.cap').textContent = figs[k].c;
    f.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === k));
  }
});
document.getElementById('tocOpen').onclick = () => tocShow(true);
document.getElementById('tocClose').onclick = () => tocShow(false);
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'Escape') tocShow(false); });
addEventListener('resize', () => go(cur, false));
// URLの #ev などから、その使い方を開く
const h = location.hash.slice(1); const start = slides.findIndex((s) => (s.use && s.use.id === h) || (h === 'basic' && s.name === '基本操作') || (h === 'faq' && s.name === 'よくある質問'));
requestAnimationFrame(() => { if (start > 0) go(start, false); mark(); });
})();
</script>
</body>
</html>
