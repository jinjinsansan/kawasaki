<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>OGP 1200×630｜2026年 クライマックスプラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&amp;family=Zen+Kaku+Gothic+New:wght@700;900&amp;family=Oswald:wght@500;700&amp;display=swap">
<style>
html, body { margin: 0; background: #000; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; font-family: "Zen Kaku Gothic New", sans-serif; color: #fff; background: radial-gradient(90% 120% at 38% 50%, #e3202e 0, #b10f1c 32%, #5e070d 66%, #1b0605 100%); }
.og::before { content: ""; position: absolute; z-index: -2; left: 38%; top: 50%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; background: repeating-conic-gradient(from 0deg, rgba(255, 226, 150, .16) 0 5deg, transparent 5deg 13deg); }
.og::after { content: ""; position: absolute; z-index: -1; inset: 0; background: radial-gradient(circle, rgba(0, 0, 0, .25) 1.6px, transparent 2.2px) 0 0 / 10px 10px; -webkit-mask: linear-gradient(90deg, transparent 50%, #000); mask: linear-gradient(90deg, transparent 50%, #000); }
.foil { background: linear-gradient(100deg, #b8862e, #f5dc92 22%, #fff6d8 32%, #e2b857 46%, #a8761f 62%, #f5dc92 80%, #c9973a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.k { position: absolute; left: 64px; top: 52px; padding: 10px 22px; background: #0a0606; color: #f5dc92; font-size: 30px; box-shadow: 0 0 0 3px #e2b857; }
.t { position: absolute; left: 60px; top: 132px; line-height: 1; filter: drop-shadow(0 7px 0 rgba(40, 0, 0, .65)); }
.t .y { display: block; font-family: "Oswald", sans-serif; font-size: 96px; }
.t .y small { font-family: "Zen Kaku Gothic New"; font-size: 60px; }
.t .c { display: block; margin-top: 8px; font-size: 118px; letter-spacing: -.04em; }
.t .p { display: block; margin-top: 4px; font-size: 118px; }
.boom { position: absolute; left: 330px; top: 486px; padding: 12px 34px 14px; background: #ffd76a; color: #8f0c16; font-size: 64px; line-height: 1; transform: rotate(-5deg); box-shadow: 8px 8px 0 #0a0606; }
.pr { position: absolute; right: 56px; bottom: 50px; display: grid; justify-items: end; }
.pr small { font-size: 28px; }
.pr b { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 150px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(40, 0, 0, .7)) drop-shadow(0 0 28px rgba(255, 215, 106, .5)); }
.pr b span { font-family: "Zen Kaku Gothic New"; font-size: 60px; }
.st { position: absolute; right: 70px; top: 54px; width: 230px; height: 230px; display: grid; place-items: center; text-align: center; background: #0a0606; color: #fff; font-size: 26px; line-height: 1.3; border-radius: 50%; box-shadow: 0 0 0 5px #e2b857, 0 0 40px rgba(255, 215, 106, .45); transform: rotate(8deg); }
.st b { display: block; font-family: "Oswald", sans-serif; font-weight: 400; font-size: 62px; line-height: 1.05; color: #ffd76a; }

.k, .t .c, .t .p, .t .y small, .boom, .pr small, .pr b span, .st { font-weight: 900; } .t .y, .pr b, .st b { font-weight: 700 !important; }
</style>
</head>
<body>
<div class="og">
  <span class="k">過去最高のメンバーが揃うジャパンCを的中に導く特別企画</span>
  <div class="t"><span class="y foil">『2026<small>年</small></span><span class="c foil">クライマックス</span><span class="p foil">プラン』</span></div>
  <span class="boom">登場！</span>
  <span class="st"><span>直近3か月<br>回収率<b>114.9%</b></span></span>
  <div class="pr"><small>参加費用</small><b class="foil">15,000<span>円</span></b></div>
</div>
</body>
</html>
