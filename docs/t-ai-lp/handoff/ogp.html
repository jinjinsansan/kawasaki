<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>T-AI OGP 1200×630</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;700&amp;family=IBM+Plex+Mono:wght@300;400;500&amp;display=swap">
<style>
html,body{margin:0;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#f4ede4;font-family:"IBM Plex Sans JP",sans-serif;
background:radial-gradient(70% 90% at 82% 0%,rgba(122,12,20,.85),rgba(58,7,11,.4) 45%,transparent 72%),
radial-gradient(50% 60% at 0% 100%,rgba(90,10,16,.45),transparent 70%),
repeating-linear-gradient(115deg,rgba(226,184,87,.04) 0 1px,transparent 1px 70px),linear-gradient(180deg,#140d0b,#0c0a09)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(226,184,87,.14) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask:linear-gradient(90deg,transparent 30%,#000 75%);mask:linear-gradient(90deg,transparent 30%,#000 75%)}
.ring{position:absolute;right:70px;top:115px;width:400px;height:400px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:300;font-size:104px;line-height:1;color:#f5dc92}
.num small{font-size:44px;color:#e2b857}
.num i{display:block;margin-top:14px;font-style:normal;font-size:13px;letter-spacing:.34em;color:#b9aea2}
.txt{position:absolute;left:84px;top:96px;width:620px}
.eb{display:flex;align-items:center;gap:14px;font-family:"IBM Plex Mono",monospace;font-size:16px;letter-spacing:.32em;color:#e2b857}
.eb::before{content:"";width:40px;height:1px;background:#e2b857}
h1{margin:34px 0 0;font-weight:700;font-size:80px;line-height:1.25;letter-spacing:.02em}
.sub{margin-top:28px;font-weight:500;font-size:26px;color:#d8cdc0}
.sub b{display:block;margin:6px 0 0 -10px;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:40px;color:#f5dc92;letter-spacing:.06em;margin-left:6px}
.foot{position:absolute;left:84px;right:84px;bottom:56px;display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.24em;color:#b9aea2;border-top:1px solid #3a2a16;padding-top:20px}
.foot b{font-weight:400;color:#e2b857}
</style></head><body>
<div class="og" id="og">
  <div class="dots"></div>
  <div class="ring">
    <svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9973a"/><stop offset="1" stop-color="#f5dc92"/></linearGradient></defs>
    <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(244,237,228,.1)" stroke-width="1"/>
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round" pathLength="100" stroke-dasharray="23.4 100"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(226,184,87,.35)" stroke-width="3" stroke-dasharray=".3 1.37"/></svg>
    <div class="num"><span>23.4<small>%</small><i>WIN PROBABILITY</i></span></div>
  </div>
  <div class="txt">
    <p class="eb">BET SYSTEM · T-AI</p>
    <h1>競馬は、<br>予想じゃない。</h1>
    <p class="sub">選択を科学する、最強のベットシステム<b>「T-AI」</b></p>
  </div>
  <div class="foot"><span>KAWASAKI TAKASHI</span><b>t-ai.clubkawasaki.net</b></div>
</div>
</body></html>
